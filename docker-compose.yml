version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: bp-ecg-localstack
    ports:
      - "4566:4566"  # LocalStack edge port
      - "4571:4571"  # S3 legacy port (optional)
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - bp-ecg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Script de inicialização de buckets
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: bp-ecg-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh -c
    command: >
      "
      echo 'Aguardando LocalStack estar pronto...'
      sleep 5
      
      echo 'Criando bucket de entrada: raw-pdfs'
      aws --endpoint-url=http://localstack:4566 s3 mb s3://raw-pdfs || echo 'Bucket raw-pdfs já existe'
      
      echo 'Criando bucket de saída: anon-pdfs'
      aws --endpoint-url=http://localstack:4566 s3 mb s3://anon-pdfs || echo 'Bucket anon-pdfs já existe'
      
      echo 'Listando buckets criados:'
      aws --endpoint-url=http://localstack:4566 s3 ls
      
      echo 'Buckets criados com sucesso!'
      "
    networks:
      - bp-ecg-network

networks:
  bp-ecg-network:
    driver: bridge
