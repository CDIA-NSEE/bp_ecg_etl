[project]
name = "bp-ecg-etl"
version = "0.1.0"
description = "BP-ECG ETL - PDF Anonymization Pipeline for AWS Lambda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3==15.0.0",
    "aiobotocore==2.23.0",
    "boto3==1.38.27",
    "botocore==1.38.27",
    "pillow==11.3.0",
    "pymupdf>=1.24.0",
    "structlog==25.4.0",
    "ulid-py==1.1.0",
    "pydantic==2.11.7",
    "pydantic-core==2.33.2",
    "typing-extensions==4.14.1",
    "annotated-types==0.7.0",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.5",
    "mypy>=1.10.0",
    "taskipy>=1.12.2",
    "types-aiobotocore>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults
    "TCH001", # Move import into type-checking block (can break runtime)
    "TCH002", # Move import into type-checking block (can break runtime)
    "TCH003", # Move import into type-checking block (can break runtime)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py are OK

[tool.ruff.lint.isort]
known-first-party = ["bp_ecg_etl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Ignore missing imports for third-party libraries
[[tool.mypy.overrides]]
module = [
    "fitz",
    "aioboto3",
    "botocore.*",
    "ulid",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# Coverage configuration
[tool.coverage.run]
source = ["bp_ecg_etl"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Taskipy tasks
[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
type-check = "mypy bp_ecg_etl/"
test = "pytest"
test-cov = "pytest --cov=bp_ecg_etl --cov-report=term-missing"
check-all = "task format && task lint && task type-check"
pre-commit = "task format && task lint-fix && task type-check"
